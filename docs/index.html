<style>:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #66707a; --line: #e3e6ea;
  --accent: #5b4bd6; --accent-soft: #eeebff;
  --up: #d1343b; --up-soft: #fdeaea; --down: #1f6fd1; --down-soft: #e7f0fc;
  --neutral-soft: #eef0f2; --warn: #b26a00; --warn-soft: #fff4e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1a1e23; --text: #e7eaee; --muted: #9aa3ad; --line: #2b3138;
    --accent: #9d92ff; --accent-soft: #2a2550;
    --up: #ff6b70; --up-soft: #3a1d20; --down: #6aa8ff; --down-soft: #182a42;
    --neutral-soft: #262b31; --warn: #f0b04d; --warn-soft: #3a2c14;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
header {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  border-bottom: 1px solid var(--line); padding: 12px 16px;
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
main { padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile.up .v { color: var(--up); } .tile.down .v { color: var(--down); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.seg { max-width: 100%; overflow-x: auto; display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.seg button { white-space: nowrap; flex: none;
  border: 0; background: none; color: var(--text); padding: 7px 12px; font: inherit; cursor: pointer;
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
input[type=search] {
  flex: 1; min-width: 180px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit;
}
.count { color: var(--muted); font-size: 12px; margin-left: auto; }
.day { margin: 18px 0 6px; font-size: 13px; font-weight: 650; color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 48px 210px 120px 110px 1fr; gap: 10px; align-items: center;
  padding: 8px 12px; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.time { color: var(--muted); font-variant-numeric: tabular-nums; }
.co { min-width: 0; }
.co .code { font-weight: 650; font-variant-numeric: tabular-nums; margin-right: 6px; }
.co .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.co a { color: inherit; text-decoration: none; }
.co a:hover .code { color: var(--accent); }
.badge {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--neutral-soft); white-space: nowrap;
}
.badge.rev { background: var(--accent-soft); color: var(--accent); }
.badge.corr { background: var(--warn-soft); color: var(--warn); margin-left: 4px; }
.dir { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dir.up { color: var(--up); } .dir.down { color: var(--down); } .dir.none { color: var(--muted); font-weight: 400; }
.title a { color: var(--text); text-decoration: none; }
.title a:hover { text-decoration: underline; }
.title .metric { color: var(--muted); font-size: 12px; margin-left: 6px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; padding: 24px 16px 40px; text-align: center; }
@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .row { grid-template-columns: 44px 1fr auto; grid-template-areas: "time co dir" ". kind kind" ". title title"; row-gap: 3px; }
  .time { grid-area: time; } .co { grid-area: co; } .dir { grid-area: dir; }
  .kind { grid-area: kind; } .title { grid-area: title; }
  .count { width: 100%; margin-left: 0; }
}
nav.tabs { display: flex; gap: 4px; margin-top: 8px; }
nav.tabs a {
  color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 8px; font-size: 13px;
}
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.cal .row { grid-template-columns: 210px 92px 70px 150px 1fr; }
.mk { font-size: 12px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.timing.warn { color: var(--warn); font-weight: 650; }
.timing { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rev { font-size: 13px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
@media (max-width: 760px) {
  .cal .row { grid-template-columns: 1fr auto; grid-template-areas: "co num" "meta meta" "rev rev"; row-gap: 2px; }
  .cal .co { grid-area: co; } .cal .num { grid-area: num; }
  .cal .meta { grid-area: meta; } .cal .rev { grid-area: rev; }
  .cal .row > .timing, .cal .row > .mkcol { display: none; }
}
@media (min-width: 761px) { .cal .meta { display: none; } }

</style>

<script>
const ROWS = JSON.parse(document.getElementById('data').textContent);
const NEXT = '2026-10-13';
const MIN_OKU = 1.0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wd = d => '日月火水木金土'[new Date(d + 'T00:00:00').getDay()];
const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;

const state = { date: 'all', mkt: 'all', liq: true, q: '' };
try { Object.assign(state, JSON.parse(localStorage.getItem('cal-filter') || '{}'), { q: '' }); } catch (e) {}
const save = () => { try { localStorage.setItem('cal-filter', JSON.stringify({ mkt: state.mkt, liq: state.liq })); } catch (e) {} };

const dates = [...new Set(ROWS.map(r => r.date))].sort();
const dateSeg = document.getElementById('dateSeg');
dateSeg.innerHTML = '<button data-v="all">全日</button>' + dates.map(d => `<button data-v="${d}">${md(d)}(${wd(d)})</button>`).join('');
if (state.date !== 'all' && !dates.includes(state.date)) state.date = 'all';

function base() {
  return ROWS.filter(r => (state.mkt === 'all' || r.market === state.mkt) &&
    (!state.liq || (r.turnover_oku ?? 0) >= MIN_OKU));
}

function revCell(r) {
  if (r.rev_dir === 'up' || r.rev_dir === 'down') {
    const pct = r.rev_pct != null ? ` ${Math.abs(r.rev_pct).toFixed(1)}%` : '';
    return `<span class="dir ${r.rev_dir}">${r.rev_dir === 'up' ? '▲上方' : '▼下方'}${pct}</span> <span class="mk">${md(r.rev_date)} 修正済み</span>`;
  }
  if (r.rev_date) return `<span class="mk">${md(r.rev_date)} 修正あり(方向不明)</span>`;
  return '<span class="mk">直近の修正なし</span>';
}

function timingCell(r) {
  if (r.timing === '場中') return `<span class="timing warn">⚠ 場中 ${esc(r.time)}</span>`;
  return `<span class="timing">${r.confirmed ? '引け後 ' + esc(r.time) : '引け後(予定)'}</span>`;
}

function render() {
  const b = base();
  document.getElementById('nbd').textContent = `${md(NEXT)}(${wd(NEXT)})`;
  document.getElementById('tNext').textContent = b.filter(r => r.date === NEXT).length;
  document.getElementById('tAll').textContent = b.length;
  document.getElementById('tUp').textContent = b.filter(r => r.rev_dir === 'up').length;
  document.getElementById('tDown').textContent = b.filter(r => r.rev_dir === 'down').length;

  const q = state.q.trim().toLowerCase();
  const rows = b.filter(r => (state.date === 'all' || r.date === state.date) &&
    (!q || `${r.code} ${r.name} ${r.sector}`.toLowerCase().includes(q)))
    .sort((x, y) => x.date.localeCompare(y.date) || (y.turnover_oku ?? 0) - (x.turnover_oku ?? 0));
  document.getElementById('count').textContent = `${rows.length} 社`;
  if (!rows.length) { document.getElementById('out').innerHTML = '<div class="list"><div class="empty">該当する銘柄はありません</div></div>'; return; }

  let html = '', day = null;
  for (const r of rows) {
    if (r.date !== day) {
      if (day) html += '</div>';
      html += `<div class="day">${r.date.replace(/-/g, '/')}(${wd(r.date)})発表${r.date === NEXT ? ' ・ 翌営業日' : ''}</div><div class="list">`;
      day = r.date;
    }
    const oku = r.turnover_oku != null ? `${r.turnover_oku.toFixed(1)}億` : '–';
    html += `<div class="row">
      <span class="co"><a href="https://kabutan.jp/stock/?code=${encodeURIComponent(r.code)}" target="_blank" rel="noopener"><span class="code">${esc(r.code)}</span><span class="name">${esc(r.name)}</span></a></span>
      <span class="mkcol mk">${esc(r.market)} ・ ${esc(r.fq)}</span>
      <span class="num">${oku}</span>
      ${timingCell(r)}
      <span class="meta mk">${esc(r.market)} ・ ${esc(r.fq)} ・ ${esc(r.sector)} ・ ${r.timing === '場中' ? '⚠ 場中 ' + esc(r.time) : (r.confirmed ? '引け後 ' + esc(r.time) : '引け後(予定)')}</span>
      <span class="rev">${revCell(r)}</span>
    </div>`;
  }
  document.getElementById('out').innerHTML = html + '</div>';
}

function bindSeg(id, key) {
  const seg = document.getElementById(id);
  const sync = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state[key]));
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v; sync(); save(); render();
  });
  sync();
}
bindSeg('dateSeg', 'date'); bindSeg('mktSeg', 'mkt');
const liq = document.getElementById('liq');
liq.checked = state.liq;
liq.addEventListener('change', () => { state.liq = liq.checked; save(); render(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
render();
</script>
