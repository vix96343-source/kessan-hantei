<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>適時開示ウォッチ | 決算持ち越し判定君</title>
<style>:root {
  --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #66707a; --line: #e3e6ea;
  --accent: #5b4bd6; --accent-soft: #eeebff;
  --up: #d1343b; --up-soft: #fdeaea; --down: #1f6fd1; --down-soft: #e7f0fc;
  --neutral-soft: #eef0f2; --warn: #b26a00; --warn-soft: #fff4e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1a1e23; --text: #e7eaee; --muted: #9aa3ad; --line: #2b3138;
    --accent: #9d92ff; --accent-soft: #2a2550;
    --up: #ff6b70; --up-soft: #3a1d20; --down: #6aa8ff; --down-soft: #182a42;
    --neutral-soft: #262b31; --warn: #f0b04d; --warn-soft: #3a2c14;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
header {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  border-bottom: 1px solid var(--line); padding: 12px 16px;
}
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
main { padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile.up .v { color: var(--up); } .tile.down .v { color: var(--down); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.seg { max-width: 100%; overflow-x: auto; display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.seg button { white-space: nowrap; flex: none;
  border: 0; background: none; color: var(--text); padding: 7px 12px; font: inherit; cursor: pointer;
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
input[type=search] {
  flex: 1; min-width: 180px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit;
}
.count { color: var(--muted); font-size: 12px; margin-left: auto; }
.day { margin: 18px 0 6px; font-size: 13px; font-weight: 650; color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 48px 210px 120px 110px 1fr; gap: 10px; align-items: center;
  padding: 8px 12px; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.time { color: var(--muted); font-variant-numeric: tabular-nums; }
.co { min-width: 0; }
.co .code { font-weight: 650; font-variant-numeric: tabular-nums; margin-right: 6px; }
.co .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.co a { color: inherit; text-decoration: none; }
.co a:hover .code { color: var(--accent); }
.badge {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--neutral-soft); white-space: nowrap;
}
.badge.rev { background: var(--accent-soft); color: var(--accent); }
.badge.corr { background: var(--warn-soft); color: var(--warn); margin-left: 4px; }
.dir { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dir.up { color: var(--up); } .dir.down { color: var(--down); } .dir.none { color: var(--muted); font-weight: 400; }
.title a { color: var(--text); text-decoration: none; }
.title a:hover { text-decoration: underline; }
.title .metric { color: var(--muted); font-size: 12px; margin-left: 6px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; padding: 24px 16px 40px; text-align: center; }
@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .row { grid-template-columns: 44px 1fr auto; grid-template-areas: "time co dir" ". kind kind" ". title title"; row-gap: 3px; }
  .time { grid-area: time; } .co { grid-area: co; } .dir { grid-area: dir; }
  .kind { grid-area: kind; } .title { grid-area: title; }
  .count { width: 100%; margin-left: 0; }
}
nav.tabs { display: flex; gap: 4px; margin-top: 8px; }
nav.tabs a {
  color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 8px; font-size: 13px;
}
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

</style>
</head>

<header><div class="wrap">
  <h1>適時開示ウォッチ</h1>
  <div class="sub">TDnet 取り込み 2026-10-09 15:01 更新 ・ 履歴 2026-09-08 以降</div>
  <nav class="tabs">
    <a href="index.html">決算予定</a>

</div></header>
<main class="wrap">

  <div class="controls">
    <div class="seg" id="kindSeg" role="group" aria-label="種別">
      <button data-v="rev" aria-pressed="true">修正</button>
      <button data-v="earnings_report" aria-pressed="false">短信</button>
      <button data-v="earnings_presentation" aria-pressed="false">説明資料</button>
      <button data-v="all" aria-pressed="false">すべて</button>
    </div>
    <div class="seg" id="dirSeg" role="group" aria-label="方向">
      <button data-v="all" aria-pressed="true">全方向</button>
      <button data-v="up" aria-pressed="false">上方</button>
      <button data-v="down" aria-pressed="false">下方</button>
    </div>
    <input type="search" id="q" placeholder="コード・会社名・表題で検索" aria-label="検索">
    <span class="count" id="count"></span>
  </div>

  <div id="out"></div>
</main>

<script>
const ROWS = JSON.parse(document.getElementById('data').textContent);
const KIND = {
  forecast_revision: '業績修正', forecast_dividend_revision: '業績・配当修正', dividend_revision: '配当修正',
  forecast_initial: '予想公表', actual_vs_forecast: '予実差異', earnings_report: '決算短信',
  earnings_presentation: '説明資料'
};
const REV = new Set(['forecast_revision', 'forecast_dividend_revision', 'dividend_revision', 'forecast_initial', 'actual_vs_forecast']);
function metricLabel(m) {
  if (/Operating(Income|Profit)/.test(m)) return '営業利益';
  if (/Ordinary/.test(m)) return '経常利益';
  if (/ProfitAttributable|NetIncome|Profit/.test(m)) return '純利益';
  if (/Sales|Revenue/.test(m)) return '売上';
  return m;
}
const state = { kind: 'rev', dir: 'all', q: '' };
try { Object.assign(state, JSON.parse(localStorage.getItem('dw-filter') || '{}'), { q: '' }); } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function dirCell(r) {
  if (r.direction === 'up' || r.direction === 'down') {
    const arrow = r.direction === 'up' ? '▲' : '▼';
    const pct = r.change_pct !== '' ? ` ${Math.abs(+r.change_pct).toFixed(1)}%` : '';
    return `<span class="dir ${r.direction}">${arrow}${pct}</span>`;
  }
  if (r.direction === 'flat') return '<span class="dir none">据え置き</span>';
  return '<span class="dir none">–</span>';
}

function render() {
  const q = state.q.trim().toLowerCase();
  const rows = ROWS.filter(r =>
    (state.kind === 'all' || (state.kind === 'rev' ? REV.has(r.kind) : r.kind === state.kind)) &&
    (state.dir === 'all' || r.direction === state.dir) &&
    (!q || (r.code + ' ' + r.name + ' ' + r.title).toLowerCase().includes(q)));
  document.getElementById('count').textContent = `${rows.length} 件`;
  if (!rows.length) { document.getElementById('out').innerHTML = '<div class="list"><div class="empty">該当する開示はありません</div></div>'; return; }

  let html = '', day = null;
  for (const r of rows) {
    const d = r.disclosed_at.slice(0, 10);
    if (d !== day) {
      if (day) html += '</div>';
      const dt = new Date(d + 'T00:00:00');
      html += `<div class="day">${d.replace(/-/g, '/')}(${'日月火水木金土'[dt.getDay()]})</div><div class="list">`;
      day = d;
    }
    const metric = r.metric ? `<span class="metric">${r.period.startsWith('CurrentAccumulatedQ2') ? '中間' : '通期'}${metricLabel(r.metric)}</span>` : '';
    html += `<div class="row">
      <span class="time">${r.disclosed_at.slice(11)}</span>
      <span class="co"><a href="https://kabutan.jp/stock/?code=${encodeURIComponent(r.code)}" target="_blank" rel="noopener"><span class="code">${esc(r.code)}</span><span class="name">${esc(r.name)}</span></a></span>
      <span class="kind"><span class="badge ${REV.has(r.kind) ? 'rev' : ''}">${KIND[r.kind] || r.kind}</span>${r.is_correction === 'True' ? '<span class="badge corr">訂正</span>' : ''}</span>
      ${dirCell(r)}
      <span class="title"><a href="${esc(r.pdf_url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${metric}</span>
    </div>`;
  }
  document.getElementById('out').innerHTML = html + '</div>';
}

function bindSeg(id, key) {
  const seg = document.getElementById(id);
  const sync = () => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state[key]));
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v; sync(); render();
    try { localStorage.setItem('dw-filter', JSON.stringify({ kind: state.kind, dir: state.dir })); } catch (e) {}
  });
  sync();
}
bindSeg('kindSeg', 'kind'); bindSeg('dirSeg', 'dir');
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
render();
</script>
