# 好決算の基準
#
# ここに書いた基準に当てはまった決算を「好決算」とし、その会社の
#   ・次の決算(TDnet 決算速報の一覧の行)に「前回◎」
#   ・決算時間サイトの発表予定に「前回◎」
# の印を付けます。GitHub の画面でこのファイルを編集すれば、15秒ほどで反映されます。
#
# match: any … rules のどれか1つに当てはまれば好決算
#        all … rules のすべてに当てはまれば好決算
#
# when には1行の式を書きます。使えるのは 数値・下の名前・+ - * / ・ >= > <= < == != ・ and or not ・( )
# 値が無い名前(受注を出していない会社の orders_yoy など)を使った比較は「当てはまらない」になります。
#
# 使える名前(%は前年比などの増減率。3か月 = 四半期単独の値)
#   sales_yoy / op_yoy / ordinary_yoy / net_yoy           売上高・営業利益・経常利益・純利益 累計の前年同期比(%)
#   sales_q_yoy / op_q_yoy / ordinary_q_yoy / net_q_yoy   同 3か月の前年同期比(%)
#   sales_qoq / op_qoq / ordinary_qoq / net_qoq           同 3か月の前四半期比(%)
#   sales / op / ordinary / net                           同 3か月の値(百万円)
#   margin          営業利益率 3か月(%)
#   margin_yoy_pt   営業利益率 3か月の前年同期からの差(pt)
#   orders_yoy      受注高の前年同期比(%)
#   orders_qoq      受注高 3か月の前四半期比(%)
#   backlog_yoy     受注残高の前年同期比(%)
#   backlog_qoq     受注残高の前四半期末比(%)
#   progress        営業利益の会社予想(通期)に対する進捗率(%)
#   revised         短信で業績予想を修正した(1/0)
#
#  【1. 期待に対する上振れ】
#   cons_beat         経常利益の累計 ÷ コンセンサス(株予報、発表前)の同じ四半期累計 − 1(%)。本決算は通期
#   guidance_vs_cons  会社予想(通期の営業利益) ÷ コンセンサスの通期営業利益 − 1(%)。本決算は来期予想どうし
#   progress_gap      営業利益の進捗率 − 過去3年の同じ四半期の進捗率の平均(pt)。会社計画に対する上振れ
#   revised_up        決算と同じ日に業績予想を上方修正した(1/0)
#  【2. 中身の上振れ】
#   seg_op_yoy_max    セグメント利益の前年同期比(累計)の一番大きいセグメントの値(%)
#   seg_op_yoy_min    同 一番小さいセグメントの値(%)。「全セグメント増益」は seg_op_yoy_min > 0
#   orders_record     3か月の受注高が過去(4四半期以上)の最高を更新(1/0)
#   backlog_record    受注残高が過去(4四半期以上)の最高を更新(1/0)
#  【3. 伸び方】
#   sales_qoq_vs_ly   売上高の前四半期比 − 前年の同じ四半期の前四半期比(pt)。季節性をならした伸び
#   op_qoq_vs_ly      営業利益の 同上(pt)
#   margin_qoq_pt     営業利益率 3か月の前四半期からの差(pt)
#   seg_margin_up     利益率が前年同期より上がったセグメントの割合(%)
#  【4. 決算への株価の反応】
#   reaction          株価の反応(%): 発表前の終値 → 発表後の終値(場中の発表は前日終値 → 当日終値)
#
#  ※ 製品価格・中期経営計画/KPI との比較、同業の決算・市場環境(5.)は自動で取れるデータが無いので、まだ使えません
#  ※ コンセンサスは株予報に予想がある会社(決算予定の約4割)だけ、反応は 2026/9 以降の決算だけ
#
# 例(先頭の # を消すと有効になります)
#   - name: 営業利益の大幅増
#     when: op_q_yoy >= 30 and sales_q_yoy >= 10
#   - name: 受注の伸び
#     when: orders_yoy >= 20 or backlog_yoy >= 20
#   - name: 株価が好反応
#     when: reaction >= 5

match: any
