# 決算持ち越し判定君 設定ファイル
# 重み・閾値はここで調整する(コードにハードコードしない)

http:
  user_agent: "kessan-hantei/0.1 (personal research tool)"
  min_interval_sec: 1.0   # 1リクエスト/秒以下
  retries: 3
  timeout_sec: 20

disclosures:
  # TDnetの一覧は約1ヶ月分しか遡れない
  lookback_days: 1          # 通常実行時に再取得する過去日数(当日 + N日)
  backfill_max_days: 31     # --days で指定できる上限
  # disclosures.csv に保存する開示種別(other は捨てる)
  store_kinds:
    - forecast_revision
    - dividend_revision
    - forecast_dividend_revision
    - forecast_initial
    - actual_vs_forecast
    - earnings_report
    - earnings_presentation
  # 速報には TDnet に出たものを全部出す(グロースも含む)。持ち越し判定の市場フィルタは judge 側で行う
  filter_by_universe: false
  # XBRLを取得して修正率を読む種別
  parse_xbrl_kinds:
    - forecast_revision
    - forecast_dividend_revision

factors:
  revision_recency:
    weight: -0.10            # 負方向(直前に修正済みならサプライズ余地が減る)
    window_days: 90
    decay: linear            # linear: 新しい修正ほど1に近い / flat: 窓内なら1
    count_kinds:
      - forecast_revision
      - forecast_dividend_revision
    exclude_corrections: true
    # 前回決算短信と同日の修正は「前回決算の一部」とみなして除外
    exclude_same_day_as_earnings: true

universe:
  turnover_days: 20
  update_weekday: 0          # dailyワークフローで週1更新する曜日(0=月曜)

calendar:
  horizon_business_days: 5   # 翌営業日〜N営業日先
  intraday_cutoff: "15:00"   # これより前の発表は「場中」

judge:
  min_avg_turnover: 100000000   # 一次フィルタ: 平均売買代金 1億円/日

reaction:
  # 上昇確度 = 同じバケットの過去開示で「開示前終値 → 開示後最初の終値」が上がった割合
  close_time: "15:30"        # これより前の開示は当日終値で評価
  large_change_pct: 10       # 修正率がこれ以上なら「大幅」バケット
  prior_n: 10                # 縮小推定: 全体の上昇率をこの件数ぶん混ぜる
  max_abs_ret_pct: 50        # これを超える変化は分割未調整などの異常値として除外
  price_period: "3mo"


earnings:
  # 決算短信の「上がりやすい決算内容」への親和性(src/earnings.py)
  max_per_run: 300           # 1回の実行で評価する短信の上限(TDnet XBRL 1秒/件)
  types:
    recruit:                 # ① リクルート型(q-accel と同じ)
      min_accel: 3.0         # 単Q売上YoY − 直近1年売上YoY (pt)
      min_margin_delta: 0.0  # 営業利益率の前年同期差 (pt)
    kioxia:                  # ② キオクシア型(目安: 主力売上QoQ+20%、営業利益+50%)
      min_sales_qoq: 20.0
      min_op_qoq: 50.0
      min_qoq_excess: 10.0   # 前年の同じQoQより何pt強いか(季節性の除外)
    rorze_b:                 # ③ ローツェ型B(好調・予想据え置き)
      max_conservatism: 0.85 # 残り期間の想定営業益 ÷ 前年同期間×今期の伸び

irdocs:
  # TDnet に説明資料が無い決算は、各社IRサイトから説明資料PDFを探す
  lookback_days: 31          # 何日前の決算まで探すか
  max_attempts: 6            # 見つからないときに探し直す回数
  retry_minutes: 60          # 探し直す間隔(説明資料は短信より後に載ることが多い)
  max_pages: 15              # 1社あたりに見るページ数の上限
  time_budget_sec: 25        # watch の1分ごとの確認で使う時間の上限
  render: true               # 見つからなければブラウザ(Playwright)で表示して探し直す
  render_max_pages: 8
  workers: 6                 # 別々の会社のサイトを同時に探す数(同じサイトへは1秒に1回まで)
  render_workers: 3          # ブラウザ表示で探す同時数
  checkpoint_every: 20       # 何件ごとに途中保存するか
