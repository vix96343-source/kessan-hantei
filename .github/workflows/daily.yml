name: daily

# (月曜) universe → calendar → アナリスト予想 → 株価反応 → サイト再生成
# 毎日の実行は watch の中で平日 20:05 以降に行う(定時実行は遅れや飛ばしがあるため)。ここは手動でやり直すとき用
on:
  workflow_dispatch:
    inputs:
      force_universe:
        description: 'universe(銘柄一覧・売買代金)も更新する'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt


      - name: Run
        run: python -m src.cli run ${{ github.event.inputs.force_universe == 'true' && '--force-universe' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: daily $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
