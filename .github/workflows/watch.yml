name: watch

# TDnet を15秒おきに確認し、決算短信・修正などの新しい開示があればすぐにサイトへ反映する(平日 7:30〜20:00 JST)。
# GitHub の定時実行は数時間遅れたり飛ばされたりするので、
#  - 30分おきに起動を予約する(動いている監視があれば同じ concurrency グループで待ち、終わったらすぐ引き継ぐ)
#  - ジョブの最長6時間が近づいたら、20:00 前なら自分で次の監視を起動してから終わる
on:
  schedule:
    - cron: '*/30 22-23 * * 0-4'   # JST 7:00〜8:30(月〜金)
    - cron: '*/30 0-10 * * 1-5'    # JST 9:00〜19:30(月〜金)
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # 次の監視を自分で起動する(workflow_dispatch)

# data/ と docs/ にコミットする他のワークフロー(daily)と直列化する
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check watch hours
        id: hours
        run: |
          # 平日 7:30〜20:00 JST の間だけ監視する(それ以外に起動した予約はすぐ終わる)
          now=$(TZ=Asia/Tokyo date +%H%M); dow=$(TZ=Asia/Tokyo date +%u)
          if [ "$dow" -le 5 ] && [ "$now" -ge 0730 ] && [ "$now" -lt 2000 ]; then echo "run=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.hours.outputs.run == '1'

      - uses: actions/setup-python@v5
        if: steps.hours.outputs.run == '1'
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.hours.outputs.run == '1'

      # IRサイトの説明資料探し(JavaScriptで一覧を作るサイト用)に使うブラウザ
      - run: python -m playwright install --with-deps chromium
        if: steps.hours.outputs.run == '1'

      - name: Watch TDnet every 15 seconds
        if: steps.hours.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 20:00 JST か、ジョブの上限(6時間)の手前の 5時間40分 の早い方まで
          end_ts=$(TZ=Asia/Tokyo date -d "today 20:00" +%s)
          limit_ts=$(( $(date +%s) + 340 * 60 ))
          [ "$limit_ts" -lt "$end_ts" ] && end_ts=$limit_ts
          echo "watching until $(TZ=Asia/Tokyo date -d @$end_ts '+%H:%M') JST"
          last_ir=0
          while [ "$(date +%s)" -lt "$end_ts" ]; do
            t0=$(date +%s)
            # GitHub の画面で手動登録(data/manual_docs.csv)された変更などを取り込む
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; true; }
            python -m src.cli disclosures --days 0 || echo "::warning::tick failed"
            # TDnet に無い説明資料を各社IRサイトで探す。開示の確認を遅らせないよう5分に1回、長くても60秒で打ち切る
            if [ $(( $(date +%s) - last_ir )) -ge 300 ]; then
              timeout 60 python -m src.cli irdocs --budget 25 || echo "::warning::irdocs timeout or failed"
              last_ir=$(date +%s)
            fi
            git add data/ docs/
            if ! git diff --cached --quiet; then
              git commit -q -m "data: watch $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
              if ! { git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q; }; then
                # 競合したらこの回の結果は捨てて最新に合わせる(次の回で取り直す)
                git rebase --abort 2>/dev/null || true
                git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
                echo "::warning::push failed, resynced"
              fi
            fi
            elapsed=$(( $(date +%s) - t0 ))
            [ "$elapsed" -lt 15 ] && sleep $(( 15 - elapsed ))
          done
          # 6時間の上限で終わるときは、20:00 前なら次の監視を起動して引き継ぐ
          if [ "$(TZ=Asia/Tokyo date +%H%M)" -lt 1955 ]; then
            gh workflow run watch.yml --ref "${GITHUB_REF_NAME}" && echo "next watch dispatched"
          fi
