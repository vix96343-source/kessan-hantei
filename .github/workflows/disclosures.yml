name: disclosures

# TDnet適時開示の取り込み。平日 JST 8:00〜19:45 に15分おき。
# GitHub Actions の cron は混雑時に10〜30分遅れることがある(準リアルタイム)。
on:
  schedule:
    - cron: '*/15 23 * * 0-4'   # JST 8:00-8:45 (月〜金)
    - cron: '*/15 0-10 * * 1-5' # JST 9:00-19:45 (月〜金)
  workflow_dispatch:
    inputs:
      days:
        description: '遡る日数(初回バックフィルは 31)'
        required: false
        default: '1'

permissions:
  contents: write

# data/ にコミットする他のワークフロー(daily / review)と同じグループで直列化する
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # 株探の四半期履歴は再配布しないためコミットせず、Actionsのキャッシュで実行間に引き継ぐ
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: kabutan-${{ github.run_id }}
          restore-keys: kabutan-

      - name: Ingest disclosures
        run: python -m src.cli disclosures --days "${{ github.event.inputs.days || '1' }}"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: disclosures $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
